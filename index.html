<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TT Go!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#07070a;--fg:#f2ede0;--pn:#131313;--mut:#9a9486;--ln:#2b2514;--ac:#d4af37;--ac2:#f7df8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -80px,#251c05,transparent 70%),var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1,h2,h3,.nm,.ovr,.bal,.tile b,.s b,.pf b{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.05em;background:linear-gradient(90deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:8px 0;font-size:30px;font-weight:800}
h3{margin:0 0 8px;font-size:21px;color:var(--ac2)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;background:rgba(7,7,10,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bal{font-size:19px;font-weight:700;color:var(--ac2);border:1px solid var(--ln);padding:3px 14px;border-radius:999px;background:#17130a}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#1a1a1a;color:var(--fg);padding:8px 14px;border-radius:10px;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--ac)}
button.on,.btn{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#1a1300;border-color:var(--ac);font-weight:700}
.btn{padding:10px 20px}
button:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut)}
.msg{text-align:center;margin:6px 0;color:var(--ac2)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.panel{margin:10px 0;background:linear-gradient(180deg,#171717,#0f0f0f);border:1px solid var(--ln);border-radius:14px;padding:14px 18px}
.shop{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.tile{background:#101010;border:1px solid var(--ln);border-radius:12px;padding:8px 16px;min-width:130px}
.tile b{font-size:30px;font-weight:800;color:var(--ac2)}
.tile span{display:block;color:var(--mut);font-size:12px}
.bar{height:8px;background:#1d1a10;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;flex:1;min-width:240px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln);background:#0b0b0b;color:var(--fg);min-width:0}
.card,.stk{--s:75%;--rc:hsl(var(--h) var(--s) 58%);--rk:#9aa0a6;--gl:10px;--ga:.38}
.card{position:relative;flex:none;width:150px;height:225px;border-radius:14px;background:#0d0d0d;border:1.5px solid var(--rc);overflow:hidden;isolation:isolate;box-shadow:0 0 var(--gl) 1px hsl(var(--h) var(--s) 58% / var(--ga)),0 8px 20px rgba(0,0,0,.55);transition:translate .15s}
.card:hover{translate:0 -4px}
.card[data-r="Rare"]{--rk:#4f9dff;--gl:15px;--ga:.5}
.card[data-r="Epic"]{--rk:#e6c36a;--gl:19px;--ga:.6}
.card[data-r="Legendary"]{--rk:#ffcc33;--gl:24px;--ga:.75}
.in{position:absolute;inset:0}
.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:46px;font:800 82px/1 "Barlow Condensed",sans-serif;color:rgba(255,255,255,.2);background:radial-gradient(circle at 50% 35%,hsl(var(--h) var(--s) 38%),hsl(var(--h) var(--s) 13%) 72%),#000}
.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 10px)}
.card[data-r="Legendary"] .art{background:radial-gradient(circle at 50% 28%,hsl(var(--h) var(--s) 46%),hsl(var(--h) var(--s) 12%) 72%),#000;color:rgba(255,226,130,.4)}
.card[data-r="Legendary"] .art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(255,215,100,.38),transparent 60%)}
.card[data-r="Epic"] .art{color:rgba(255,233,160,.36);background:linear-gradient(135deg,rgba(255,255,255,.2) 0 10%,transparent 10%),linear-gradient(225deg,hsl(var(--h) 90% 75% / .3) 0 16%,transparent 16%),linear-gradient(62deg,transparent 52%,hsl(var(--h) 90% 65% / .3) 52% 70%,transparent 70%),linear-gradient(300deg,transparent 38%,rgba(255,255,255,.12) 38% 50%,transparent 50%),radial-gradient(circle at 72% 24%,hsl(var(--h) var(--s) 45%),hsl(var(--h) var(--s) 20%) 55%,hsl(var(--h) var(--s) 8%))}
.card[data-r="Epic"] .art::before{inset:auto;left:-25%;right:-25%;top:26%;height:24%;transform:rotate(-26deg);background:linear-gradient(90deg,transparent,#8a5f14 8%,#ffe9a0 30%,#fff7d6 48%,#d9a63c 66%,#8a5f14 90%,transparent);clip-path:polygon(0 25%,45% 0,100% 20%,100% 75%,55% 100%,0 80%);opacity:.9}
.card::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 48%,transparent 61%);background-size:260% 100%;animation:sheen 4s linear infinite}
.card[data-r="Rare"]::after,.card[data-r="Epic"]::after,.card[data-r="Legendary"]::after{opacity:1}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
.ovr{position:absolute;top:8px;left:9px;z-index:2;font-size:36px;font-weight:800;line-height:1;color:#fff;text-shadow:0 2px 8px #000}
.ovr small{display:block;font:700 9px system-ui,sans-serif;letter-spacing:.1em;color:var(--rk)}
.rar{position:absolute;top:10px;right:8px;z-index:2;font:700 9px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#0a0a0a;background:var(--rk);padding:2px 7px;border-radius:999px}
.tag,.cnt{position:absolute;z-index:4;top:34px;right:8px;font:700 11px system-ui,sans-serif;padding:1px 7px;border-radius:6px;font-style:normal}
.tag{background:#f7df8a;color:#111}.cnt{background:#000a;color:#fff}
.info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.94) 42%)}
.nm{font-size:21px;font-weight:800;line-height:1.05;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sts{display:flex;justify-content:space-between;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.15)}
.s{text-align:center;flex:1}
.s b{display:block;font-size:18px;font-weight:800;color:var(--rc)}
.s span{font-size:9px;color:#a9a396;letter-spacing:.07em;text-transform:uppercase}
.card[onclick]{cursor:pointer}
a.btn{display:inline-block;text-decoration:none;border-radius:10px}
#dt{position:fixed;inset:0;z-index:8;display:none;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px;overflow:auto}
#dt.on{display:flex}
.dtbox{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:780px;background:linear-gradient(180deg,#171717,#0d0d0d);border:1px solid var(--ln);border-radius:16px;padding:20px 24px;margin:auto}
.dti{flex:1;min-width:260px}
.card.whole{cursor:pointer}
.card.win{box-shadow:0 0 28px 4px hsl(var(--h) var(--s) 58% / .8),0 8px 20px rgba(0,0,0,.55)}
.card.lock{filter:grayscale(1);opacity:.35}
.card.pop{animation:pop .45s both}
@keyframes pop{from{transform:scale(.5) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:9;background:radial-gradient(circle at 50% 40%,#fff 0,var(--fc,#3d7bff) 40%,transparent 75%)}
#flash.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.aura{position:relative;isolation:isolate;margin:18px;--a1:hsl(var(--h,220) 90% 58%);--a2:#ffd36b}
.aura[data-r="Legendary"]{--a2:#fff2a8}
.aura::before{content:"";position:absolute;inset:-34px;z-index:-1;border-radius:50%;background:conic-gradient(var(--a1),transparent 25%,var(--a2) 50%,transparent 75%,var(--a1));filter:blur(18px);animation:turn 3s linear infinite,beat 1.1s ease-in-out infinite}
.aura::after{content:"";position:absolute;inset:-4px;z-index:-1;border-radius:18px;box-shadow:0 0 34px 10px var(--a1);animation:beat 1.1s ease-in-out infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes beat{50%{opacity:.5;scale:1.08}}
.shake{animation:shk .7s cubic-bezier(.36,.07,.19,.97) 2 both}
.shake.hard{animation-duration:.5s;animation-iteration-count:4}
@keyframes shk{10%,90%{translate:-2px 1px}20%,80%{translate:5px -2px;rotate:-.6deg}30%,50%,70%{translate:-9px 3px;rotate:.8deg}40%,60%{translate:9px -3px;rotate:-.8deg}}
.stage{min-height:340px;text-align:center}
.rev{cursor:pointer}
.big{display:inline-block;transform:scale(1.3);margin:60px 0 52px}
.tm{display:block;height:3px;width:170px;margin:4px auto 10px;background:linear-gradient(90deg,var(--ac),var(--ac2));transform-origin:left;animation:tm 2s linear forwards}
@keyframes tm{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.packart,.ptop,.pbot{background:linear-gradient(90deg,#1a1a1a 0%,#3b3012 16%,#d4af37 30%,#fff3b0 40%,#b8901f 50%,#2a220c 66%,#d4af37 82%,#1a1a1a 100%);background-size:220% 100%;animation:foil 3.2s linear infinite}
@keyframes foil{from{background-position:0 0}to{background-position:-220% 0}}
.packart{width:120px;height:176px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;font-family:"Barlow Condensed",sans-serif;flex:none}
.packart b{font-size:22px;font-weight:800}.packart i{font-style:normal;font-size:14px}
.pk{position:relative;width:200px;height:300px;margin:24px auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.7))}
.ptop,.pbot{position:absolute;inset:0}
.pf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#15110a}
.pf b{font-size:34px;font-weight:800;letter-spacing:.04em}.pf i{font-style:normal;font-size:16px;font-weight:600}
.pf u{position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 1px,transparent 1px 5px)}
.pbot .pf u{top:auto;bottom:0}
.pcards{position:absolute;left:12px;right:12px;top:46px;height:240px;border-radius:10px;background:linear-gradient(#fff3b0,#8a6d1a);opacity:0}
.burst{position:absolute;left:50%;top:40px;width:280px;height:130px;margin-left:-140px;background:radial-gradient(ellipse,#fff 0,rgba(255,225,130,.85) 25%,transparent 70%);opacity:0;mix-blend-mode:screen;pointer-events:none}
.pk s{position:absolute;left:50%;top:66px;width:6px;height:6px;border-radius:2px;background:#ffe27a;opacity:0}
.pk.shk{animation:pshk .95s ease-in both}
@keyframes pshk{0%{transform:rotate(0)}12%{transform:rotate(-2deg) translateX(-3px)}24%{transform:rotate(2deg) translateX(3px)}36%{transform:rotate(-3deg) translateX(-4px)}48%{transform:rotate(3deg) translateX(4px)}60%{transform:rotate(-4deg) translateX(-5px)}72%{transform:rotate(4deg) translateX(5px)}100%{transform:rotate(-1deg) scale(1.06)}}
.pk.rip .ptop{animation:flyoff .8s cubic-bezier(.4,0,.8,.6) forwards}
.pk.rip .pbot{animation:slide 1s .3s ease-in forwards}
.pk.rip .pcards{animation:rise 1s .1s ease-out forwards}
.pk.rip .burst{animation:burst .9s ease-out forwards}
.pk.rip s{animation:spark .9s ease-out forwards}
@keyframes flyoff{to{transform:translate(170px,-130px) rotate(40deg);opacity:0}}
@keyframes slide{to{transform:translateY(70px) scale(.96);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(-34px)}}
@keyframes burst{0%{opacity:0;scale:.3}30%{opacity:1}100%{opacity:0;scale:2.3}}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
.pk.idle{animation:float 2.2s ease-in-out infinite;cursor:pointer}
@media(prefers-reduced-motion:reduce){.shake,.aura::before,.aura::after,.card::after,.packart,.ptop,.pbot,.pk,.pk *,#flash.go,.tm{animation:none!important}}
.art img{position:relative;z-index:1;max-width:90%;max-height:72%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.65))}
.gm{position:absolute;z-index:3;top:62px;left:8px;width:34px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));pointer-events:none}

.card[data-t="marble"]{--gl:26px;--ga:.8;background:#efe9db}
.card[data-t="marble"] .art{color:rgba(138,101,22,.3);background:linear-gradient(135deg,rgba(0,0,0,.05) 0 16%,transparent 16%),linear-gradient(215deg,rgba(255,255,255,.8) 0 12%,transparent 12%),linear-gradient(75deg,transparent 60%,rgba(0,0,0,.05) 60% 70%,transparent 70%),repeating-linear-gradient(115deg,transparent 0 26px,rgba(201,150,43,.4) 26px 27px,transparent 27px 58px),repeating-linear-gradient(28deg,transparent 0 34px,rgba(201,150,43,.28) 34px 35px,transparent 35px 70px),radial-gradient(120% 80% at 30% 18%,#fff,#ece6d8 58%,#d3cab8)}
.card[data-t="marble"] .art::before{content:"";position:absolute;inset:auto;right:-16px;top:40px;width:96px;height:96px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,#fff1b8,#c99a2e 45%,#8a6516);box-shadow:inset 0 0 0 7px #e9c46a,inset 0 0 0 10px #5c430b,inset 0 0 0 17px #f6dc8a,inset 0 0 0 20px #3b2a07,inset 0 0 0 30px #b98a24,0 4px 10px rgba(0,0,0,.35)}
.card[data-t="marble"] .art::after{content:"";position:absolute;inset:auto;left:-22%;top:50%;width:150%;height:20px;transform:rotate(-24deg);background:radial-gradient(ellipse 12px 8px at 50% 50%,transparent 38%,#a87a1c 42% 62%,#fff0a8 66%,transparent 70%) 0 0/28px 18px repeat-x,radial-gradient(ellipse 5px 9px at 50% 50%,transparent 38%,#a87a1c 42% 62%,#fff0a8 66%,transparent 70%) 14px 0/28px 18px repeat-x;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.card[data-t="marble"]::before{content:"";position:absolute;inset:0;z-index:5;border-radius:14px;pointer-events:none;box-shadow:inset 0 0 0 3px #d9aa38,inset 0 0 0 5px #fff3c4,inset 0 0 0 6.5px #9c7216}
.card[data-t="marble"] .ovr{color:#4d3708;text-shadow:0 1px 0 #fff,0 0 8px rgba(255,255,255,.8)}
.card[data-t="marble"] .info{background:linear-gradient(transparent,rgba(255,252,243,.94) 34%),repeating-linear-gradient(160deg,transparent 0 16px,rgba(120,90,20,.06) 16px 17px)}
.card[data-t="marble"] .nm{color:#3b2a07}
.card[data-t="marble"] .s b{color:#8a6516}
.card[data-t="marble"] .s span{color:#7a6a4c}
.card[data-t="marble"] .sts{border-top-color:rgba(138,101,22,.35)}
.card[data-t="marble"] .rar{color:#2a1d04}
.bg{position:absolute;z-index:3;top:58px;left:8px;display:grid;grid-template-columns:repeat(2,20px);gap:4px;align-items:center;justify-items:center}
.bg img{width:20px;height:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}

.card[data-t="prime"]{--gl:30px;--ga:.85;background:#050a3d;box-shadow:0 0 30px 2px hsl(190 100% 58% / .8),0 0 16px 4px rgba(122,44,255,.55),0 8px 20px rgba(0,0,0,.55)}
.card[data-t="prime"] .art{color:rgba(170,230,255,.28);background:radial-gradient(circle at 60% 40%,rgba(0,210,255,.6),transparent 42%),repeating-conic-gradient(from 0deg at 60% 40%,rgba(90,180,255,.26) 0 4deg,transparent 4deg 24deg),repeating-radial-gradient(circle at 60% 40%,transparent 0 16px,rgba(120,225,255,.22) 16px 17px),linear-gradient(160deg,#1c34d8,#0b1275 55%,#050a3d)}
.card[data-t="prime"] .art::before{content:"";position:absolute;inset:auto;left:26%;top:12%;width:132px;height:126px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(135deg,#9af0ff,#2b8bff 55%,#2a3fe0);opacity:.55}
.card[data-t="prime"]::before{content:"";position:absolute;inset:0;z-index:5;border-radius:14px;pointer-events:none;box-shadow:inset 0 0 0 2px #37e6ff,inset 0 0 0 4px #7a2cff,inset 0 0 0 5.5px #37e6ff,inset 0 0 18px rgba(55,230,255,.5)}
.card[data-t="prime"] .ovr{text-shadow:0 0 14px rgba(55,230,255,.9),0 2px 6px #000}
.card[data-t="prime"] .ovr small{color:#7fe9ff}
.card[data-t="prime"] .rar{background:linear-gradient(90deg,#37e6ff,#7a2cff);color:#fff}
.card[data-t="prime"] .info{background:linear-gradient(transparent,rgba(5,10,61,.97) 40%)}
.card[data-t="prime"] .nm{text-align:center}
.card[data-t="prime"] .s b{color:#7fe9ff}

const badgeList=c=>[c.g&&[BADGE,'Game Master '+c.g.slice(2)],...(c.bd||[]).map(()=>[BADGE2,'Add-ons badge']),c.pm&&[BADGE3,'TankTrouble Premium'],c.bk&&[BADGE4,'Backer'],c.bt&&[BADGE5,'Beta tester']].filter(Boolean).slice(0,5).map(b=>`<img src="${b[0]}" alt="${b[1]}" title="${b[1]}">`).join('');
const badges=c=>{const h=badgeList(c),n=(h.match(/<img/g)||[]).length;return h?`<div class="bg${n<=3?' one':''}">${h}</div>`:''};
const cardH=(c,o={})=>{const h=`<div class="card ${o.cls||''}" data-r="${c.rar}"${c.tm?` data-t="${c.tm}"`:''} style="--h:${c.h};--s:${c.s||75}%;${o.d?`animation-delay:${o.d}s`:''}"${o.click?` onclick="${o.click}"`:o.nop?'':` onclick="showCard(${c.id})"`}><div class="in"><div class="art">${c.img?`<img src="${c.img}" alt="">`:c.gl?c.gl+'\uFE0E':ini(c)}</div><div class="ovr">${c.o}<small>OVR</small></div><div class="rar">${c.ed?EDL[c.ed]:(c.g?c.g+' · ':'')+c.rar}</div>${badges(c)}${o.tag?`<i class="tag">${o.tag}</i>`:''}${o.cnt>1?`<i class="cnt">x${o.cnt}</i>`:''}<div class="info"><div class="nm">${esc(c.n)}</div><div class="sts"><div class="s"><b>${c.m}${c.est?'*':''}</b><span>Move</span></div><div class="s"><b>${c.d}${c.est?'*':''}</b><span>Dodge</span></div><div class="s"><b>${c.r}</b><span>Rep</span></div></div></div></div></div>`;
 return h};

function render(){
 const A=$('#app'),N=$('#nav');
 if(ph!='game'){N.innerHTML='';A.innerHTML=ph=='load'?`<p class="mut">Checking your account...</p>`:ph=='signup'?signupH():ph=='auth'?authH():ph=='verify'?verifyH():ph=='newpw'?newpwH():ph=='nocfg'?nocfgH():FMODE?'<div class="panel"><h2>Something went wrong</h2><p>We could not load your account. Reload the page and try again.</p><p><button class="btn" onclick="location.reload()">Reload</button></p></div>':`<div class="panel"><h2>Sign in to play</h2><p>Your cards and corals are saved to your account, so you need to be signed in to claude.ai to play. claude.ai lets you sign in or sign up with Google.</p><p>After you sign in, reload this page.</p><p><button class="btn" onclick="location.reload()">Reload</button></p></div>`;return}
 N.innerHTML=`<span class="bal">${S.cor} corals</span>`+[['home','Home'],['shop','Shop'],['col','Collection'],['lb','Leaderboard'],...(ADMIN?[['adm','Admin']]:[])].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+(CFG.snd?`<button onclick="toggleSnd()">${S.mute?'Sound off':'Sound on'}</button>`:'')+(FMODE?'<button onclick="logout()">Log out</button>':'');

async function saveCfg(){setCfg(CD);try{await DBH.doc('config/game').set(CFG);msg='Settings saved for every player.'}catch(e){msg='Could not save settings. Only editors of this page can change them.'}CD=null;render()}
function sendGift(){if(!+CD.giftAmt){msg='Set a gift amount first.';render();return}CD.giftId=CFG.giftId+1;saveCfg()}
function grantAll(){if(!ADMIN||!CFG.ag||!S)return;let n=0;for(const c of P)if(!c.gone&&!S.own[c.id]){S.own[c.id]=1;n++}if(n){msg=`${n} new card${n>1?'s':''} added to your collection.`;save()}}

async function start(user,db){
 const id=user&&await user.id();
 if(!db||!id){ph='gate';render();return}
 REF=db.collection('data/users/'+id).doc('save');UID=id;LB=db.doc('lb/'+id);try{VEMAIL=(await user.me()).email||''}catch(e){}
 try{const cs=await db.doc('config/game').get();if(cs.exists)setCfg(cs.data());const cd=await db.collection('cards').get();cd.docs.forEach(x=>applyOv(+x.id,x.data()))}catch(e){}
 const snap=await REF.get();
 S=snap.exists?Object.assign(fresh(),JSON.parse(JSON.stringify(snap.data()))):fresh();
 if(!S.own||typeof S.own!='object')S.own={};
 if(!S.stops||typeof S.stops!='object')S.stops={};
 if(!S.pot||typeof S.pot!='object')S.pot={};
 if(S.luck){S.lk=(Array.isArray(S.lk)?S.lk:[]).concat([S.luck]);delete S.luck}if(!Array.isArray(S.lk))S.lk=[];
 if(!snap.exists)await REF.set(S);
 DBH=db;ADMIN=!!(await user.canEdit());claimGift();grantAll();
 db.doc('config/game').onSnapshot(sn=>{setCfg(sn.exists?sn.data():null);claimGift();grantAll();if(ph=='game'&&!busy&&!E&&!CD)render()},()=>{});
 db.collection('cards').onSnapshot(sn=>{sn.docChanges().forEach(ch=>applyOv(+ch.doc.id,ch.type=='removed'?null:ch.doc.data()||null));grantAll();if(ph=='game'&&!busy&&!E)render()},()=>{});
 ph=S.user?'game':'signup';if(S.user){lbPush();if(CFG.mon)claimSales()}
}
/* ---- Email accounts for hosting outside claude.ai (GitHub Pages etc.), using Supabase ----
   Paste your Supabase project URL and anon (public) key here. See README.md for the steps. */
const SB_CONFIG={url:'',anonKey:''};
let SB=null,AUTH=null,FMODE=false,NOCFG='',STARTED=false,AU={m:'in',e:'',err:'',info:'',mail:''};
const loadScript=u=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=rej;document.head.appendChild(e)});
function sbDoc(col,id){
 const g=async()=>{const{data,error}=await SB.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(error)throw error;return{exists:!!data,data:()=>data?data.data:undefined}};
 const st=async d=>{const{error}=await SB.from('docs').upsert({col,id,data:JSON.parse(JSON.stringify(d)),updated_at:new Date().toISOString()});if(error)throw error};
 return{id,get:g,set:st,update:async d=>{const cur=(await g()).data()||{};await st({...cur,...d})},
  delete:async()=>{const{error}=await SB.from('docs').delete().eq('col',col).eq('id',id);if(error)throw error},
  onSnapshot:(cb,err)=>{g().then(cb).catch(err||(()=>{}));SB.channel('d'+col+id+Math.random()).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+col},p=>{const r=p.new&&p.new.id?p.new:p.old;if(r&&r.id==id)g().then(cb).catch(()=>{})}).subscribe()}}}
function sbColl(col){
 const flt=[];let ord=null,lim=null;
 const q=()=>{let b=SB.from('docs').select('id,data').eq('col',col);for(const[f,v]of flt)b=b.filter('data->>'+f,'eq',v);if(ord)b=b.order('data->'+ord[0],{ascending:ord[1]!='desc'});if(lim)b=b.limit(lim);return b};
 const mk=r=>({id:r.id,data:()=>r.data});
 const api={doc:id=>sbDoc(col,id),where:(f,op,v)=>{flt.push([f,v]);return api},orderBy:(f,d)=>{ord=[f,d];return api},limit:n=>{lim=n;return api},
  get:async()=>{const{data,error}=await q();if(error)throw error;return{docs:(data||[]).map(mk)}},
  onSnapshot:(cb,err)=>{Promise.resolve(q()).then(({data,error})=>{if(error)throw error;cb({docChanges:()=>(data||[]).map(r=>({type:'added',doc:mk(r)}))})}).catch(err||(()=>{}));
   SB.channel('c'+col+Math.random()).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+col},p=>{const del=p.eventType=='DELETE',r=del?p.old:p.new;if(!r||!r.id)return;cb({docChanges:()=>[{type:del?'removed':'modified',doc:del?{id:r.id,data:()=>null}:mk(r)}]})}).subscribe()}};
 return api}
const sbDb=()=>({collection:sbColl,doc:p=>{const i=p.lastIndexOf('/');return sbDoc(p.slice(0,i),p.slice(i+1))}});
const sbErr=x=>{const m=String(x&&x.message||'').toLowerCase();return m.includes('already')?'That email is already registered. Log in instead.':m.includes('invalid login')?'Wrong email or password.':(m.includes('weak')||m.includes('at least'))?'Choose a stronger password (at least 8 characters).':(m.includes('rate')||m.includes('too many'))?'Too many attempts. Try again later.':'Something went wrong. Please try again.'};
const here=()=>location.href.split('#')[0];
const authH=()=>`<div class="panel" style="max-width:420px;margin:30px auto"><h2>${AU.m=='up'?'Create your account':'Log in'}</h2><label>Email<input id="au_e" type="email" value="${esc(AU.e)}" placeholder="you@example.com"></label><label style="margin-top:10px">Password<input id="au_p" type="password" placeholder="At least 8 characters"></label>${AU.err?`<p class="msg" style="color:#ff8a8a">${esc(AU.err)}</p>`:''}${AU.info?`<p class="msg">${esc(AU.info)}</p>`:''}<p><button class="btn" onclick="authGo()">${AU.m=='up'?'Sign up':'Log in'}</button> <button onclick="AU.m=AU.m=='up'?'in':'up';AU.err='';AU.info='';render()">${AU.m=='up'?'I already have an account':'Create an account'}</button></p>${AU.m=='in'?'<p><button onclick="authReset()">Forgot your password?</button></p>':''}</div>`;
const verifyH=()=>`<div class="panel" style="max-width:460px;margin:30px auto"><h2>Verify your email</h2><p>We sent a verification link to <b>${esc(AU.mail)}</b>. Open it, then come back and log in.</p>${AU.info?`<p class="msg">${esc(AU.info)}</p>`:''}<p><button class="btn" onclick="AU.m='in';AU.e=AU.mail;AU.err='';AU.info='';ph='auth';render()">Go to log in</button> <button onclick="resendV()">Resend email</button></p></div>`;
const newpwH=()=>`<div class="panel" style="max-width:420px;margin:30px auto"><h2>Choose a new password</h2><label>New password<input id="np_p" type="password" placeholder="At least 8 characters"></label>${AU.err?`<p class="msg" style="color:#ff8a8a">${esc(AU.err)}</p>`:''}<p><button class="btn" onclick="setPw()">Save password</button></p></div>`;
const nocfgH=()=>`<div class="panel" style="max-width:560px;margin:30px auto"><h2>Set up accounts</h2><p>${esc(NOCFG||'Email accounts need a Supabase project.')}</p><p class="mut">Open index.html, find SB_CONFIG near the bottom of the script and paste in your Supabase project URL and anon key. The README has the full steps.</p></div>`;
async function authGo(){
 const e=($('#au_e').value||'').trim(),p=$('#au_p').value||'';AU.e=e;AU.err='';AU.info='';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){AU.err='Enter a valid email address.';render();return}
 if(AU.m=='up'&&p.length<8){AU.err='Password must be at least 8 characters.';render();return}
 if(AU.m!='up'&&!p){AU.err='Enter your password.';render();return}
 try{
  if(AU.m=='up'){const{data,error}=await SB.auth.signUp({email:e,password:p,options:{emailRedirectTo:here()}});if(error)throw error;if(!data.session){AU.mail=e;ph='verify';render()}}
  else{const{error}=await SB.auth.signInWithPassword({email:e,password:p});if(error){if(String(error.message).toLowerCase().includes('not confirmed')){AU.mail=e;ph='verify';render();return}throw error}}
 }catch(x){AU.err=sbErr(x);render()}}
async function authReset(){
 const e=($('#au_e').value||'').trim();AU.e=e;AU.err='';AU.info='';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){AU.err='Enter your email above first.';render();return}
 try{const{error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:here()});if(error)throw error;AU.info='If that email has an account, a reset link is on its way.'}catch(x){AU.err=sbErr(x)}render()}
async function resendV(){try{const{error}=await SB.auth.resend({type:'signup',email:AU.mail,options:{emailRedirectTo:here()}});if(error)throw error;AU.info='Verification email sent again.'}catch(e){AU.info='Please wait a moment before resending.'}render()}
async function setPw(){const p=$('#np_p').value||'';AU.err='';if(p.length<8){AU.err='Password must be at least 8 characters.';render();return}
 try{const{error}=await SB.auth.updateUser({password:p});if(error)throw error;location.href=here()}catch(x){AU.err=sbErr(x);render()}}
const logout=()=>SB&&SB.auth.signOut().then(()=>location.reload());
async function bootSupabase(){
 if(!SB_CONFIG.url||!SB_CONFIG.anonKey){ph='nocfg';return}
 try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');SB=supabase.createClient(SB_CONFIG.url,SB_CONFIG.anonKey);window.SBC=SB}
 catch(e){NOCFG='Could not load Supabase. Check your connection and your SB_CONFIG.';ph='nocfg';return}
 FMODE=true;AUTH=SB.auth;
 SB.auth.onAuthStateChange((ev,ses)=>{setTimeout(async()=>{
  if(ev=='PASSWORD_RECOVERY'){ph='newpw';render();return}
  if(!ses||!ses.user){if(!STARTED){ph='auth';render()}return}
  if(STARTED)return;STARTED=true;ph='load';render();
  const u=ses.user,user={id:async()=>u.id,me:async()=>({email:u.email,name:''}),canEdit:async()=>{try{const{data}=await SB.from('admins').select('uid').eq('uid',u.id).maybeSingle();return!!data}catch(e){return false}}};
  try{await start(user,sbDb())}catch(e){ph='gate'}render()},0)});
}
async function boot(){
 render();
 if(window.claude){try{const c=window.claude,[user,db]=await Promise.all([c.use('user'),c.use('db')]);await start(user,db)}catch(e){ph='gate'}render();return}
 await bootSupabase();render()
}
addEventListener('keydown',e=>{if(e.key=='Escape'){closeDt();if(!busy&&$('#ov').className=='on')closeOv()}});
boot();
