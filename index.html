<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Vault TCG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap">
<style>
:root{--bg:#e8edf2;--fg:#14202c;--pn:#fff;--mut:#5a6b7d;--ln:#cdd6df;--ac:#0e8f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202b;--fg:#e9eef4;--pn:#223041;--mut:#93a3b5;--ln:#35465a;--ac:#4fd1c5}}
:root[data-theme="dark"]{--bg:#17202b;--fg:#e9eef4;--pn:#223041;--mut:#93a3b5;--ln:#35465a;--ac:#4fd1c5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1,h2,.nm,.ovr,.pwr{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
h1{margin:0;font-size:30px;font-weight:800}
h2{margin:8px 0;font-size:24px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
nav{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--fg);padding:8px 14px;border-radius:8px}
button.on,.btn{background:var(--ac);color:#08211f;border-color:var(--ac);font-weight:700}
.btn{padding:10px 20px}
button:disabled{opacity:.5;cursor:default}
.stage{min-height:210px}
.mut{color:var(--mut)}
.hud{display:flex;justify-content:space-between;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;border-bottom:1px solid var(--ln);padding-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.arena{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin:14px 0}
.card{--rc:#8c98a6;width:132px;border:2px solid var(--rc);border-radius:10px;background:var(--pn);overflow:hidden;position:relative;flex:none}
.card[data-r="Rare"]{--rc:#4f9dff}.card[data-r="Epic"]{--rc:#b168ff}.card[data-r="Legendary"]{--rc:#ffb02e}
.art{height:88px;display:flex;align-items:center;justify-content:center;font:800 40px "Barlow Condensed",sans-serif;color:#fff;position:relative;background:linear-gradient(140deg,hsl(var(--h) 55% 42%),hsl(calc(var(--h) + 60) 60% 24%))}
.ovr{position:absolute;top:2px;left:7px;font-size:26px;font-weight:800;color:#fff}
.rar{position:absolute;bottom:3px;right:6px;font-size:11px;font-weight:600;color:#fff;opacity:.85}
.nm{padding:3px 8px 2px;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--rc)}
.st{display:flex;justify-content:space-between;padding:2px 8px;font-size:13px}
.st.pick{cursor:pointer}.st.pick:hover{background:var(--ln)}
.st.on{background:var(--rc);color:#111;font-weight:700}
.card.whole{cursor:pointer}.card.whole:hover{transform:translateY(-4px)}
.card.win{box-shadow:0 0 22px var(--rc)}.card.lose{opacity:.5}
.card.lock{filter:grayscale(1);opacity:.35}
.card.pop{animation:pop .45s both}
@keyframes pop{from{transform:scale(.5) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.card.pop{animation:none}}
.tag{position:absolute;top:4px;right:4px;background:#ffb02e;color:#111;font:700 11px sans-serif;padding:1px 6px;border-radius:6px}
.cnt{position:absolute;top:4px;right:4px;background:#0009;color:#fff;font:700 12px sans-serif;padding:0 6px;border-radius:6px}
.pwr{font-size:22px;text-align:center;font-weight:800}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 16px}
.msg{text-align:center;margin:6px 0}
 
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:9;background:radial-gradient(circle at 50% 40%,#fff 0,var(--fc,#b168ff) 40%,transparent 75%)}
#flash.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.bal{font:800 22px "Barlow Condensed",sans-serif;margin-right:6px}
.aura{position:relative;isolation:isolate;margin:18px;--a1:#b168ff;--a2:#ff4fd8}
.aura[data-r="Legendary"]{--a1:#ffb02e;--a2:#fff2a8}
.aura::before{content:"";position:absolute;inset:-28px;z-index:-1;border-radius:50%;background:conic-gradient(var(--a1),transparent 25%,var(--a2) 50%,transparent 75%,var(--a1));filter:blur(16px);animation:turn 3s linear infinite,beat 1.1s ease-in-out infinite}
.aura::after{content:"";position:absolute;inset:-4px;z-index:-1;border-radius:14px;box-shadow:0 0 30px 10px var(--a1);animation:beat 1.1s ease-in-out infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes beat{50%{opacity:.5;scale:1.08}}
.shake{animation:shk .7s cubic-bezier(.36,.07,.19,.97) 2 both}
.shake.big{animation-duration:.5s;animation-iteration-count:4}
.rumble{animation:rum .12s linear infinite}
.rumble.big{animation-duration:.06s}
@keyframes shk{10%,90%{translate:-2px 1px}20%,80%{translate:5px -2px;rotate:-.6deg}30%,50%,70%{translate:-9px 3px;rotate:.8deg}40%,60%{translate:9px -3px;rotate:-.8deg}}
@keyframes rum{0%{translate:0 0}25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px -2px}100%{translate:1px 2px}}
@media(prefers-reduced-motion:reduce){.shake,.rumble,.aura::before,.aura::after,#flash.go{animation:none}}
 
.reel{position:relative;overflow:hidden;padding:14px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.strip{display:flex;will-change:transform}
.ri{flex:none;padding:0 5px}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ac);box-shadow:0 0 12px var(--ac);z-index:2}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;flex:1;min-width:240px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);min-width:0}
.panel{margin:10px 0}
h3{margin:0 0 8px;font-size:17px}
 
.in{position:relative;height:100%}
.card[data-r="Epic"]{--rc:#e6c36a;--shape:polygon(0 6%,8% 0,92% 0,100% 6%,100% 84%,82% 94%,50% 100%,18% 94%,0 84%);border:0;border-radius:0;padding:3px;background:linear-gradient(160deg,#fbe7a1,#b8862b 35%,#f7dc8a 65%,#8a5f14);clip-path:var(--shape)}
.card[data-r="Epic"] .in{clip-path:var(--shape);color:#f4f1e6;padding-bottom:26px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2) 0 10%,transparent 10%),linear-gradient(225deg,rgba(120,190,255,.28) 0 16%,transparent 16%),linear-gradient(62deg,transparent 52%,rgba(90,150,255,.3) 52% 70%,transparent 70%),linear-gradient(300deg,transparent 38%,rgba(255,255,255,.12) 38% 50%,transparent 50%),radial-gradient(circle at 72% 24%,#2f62d8,#0c1f5c 55%,#050d2e)}
.card[data-r="Epic"] .in::before{content:"";position:absolute;left:-25%;right:-25%;top:34%;height:26%;transform:rotate(-26deg);background:linear-gradient(90deg,transparent,#8a5f14 8%,#ffe9a0 30%,#fff7d6 48%,#d9a63c 66%,#8a5f14 90%,transparent);clip-path:polygon(0 25%,45% 0,100% 20%,100% 75%,55% 100%,0 80%);opacity:.92}
.card[data-r="Epic"] .in::after{content:"";position:absolute;right:6%;top:10%;width:46px;height:46px;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.8) 12%,transparent 60%);animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;scale:.7}}
.card[data-r="Epic"] .in>:not(.tag):not(.cnt){position:relative;z-index:1}
.card[data-r="Epic"] .art{background:none;text-shadow:0 0 10px #ffd36b}
.card[data-r="Epic"] .nm{color:#ffe9a0;border-color:#c8962e}
.card[data-r="Epic"] .st b{color:#fff}
.card[data-r="Epic"] .tag,.card[data-r="Epic"] .cnt{top:16px;right:16px}
.aura{--a1:#3d7bff;--a2:#ffd36b}
.aura[data-r="Epic"]::after{display:none}
.packart{width:132px;height:190px;border-radius:12px;border:3px solid #e6c36a;background:linear-gradient(160deg,#1c3f9c,#0a1740);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe9a0;font-family:"Barlow Condensed",sans-serif;animation:rum .1s linear infinite;flex:none}
.packart.still{animation:none}
.packart::before{content:"";position:absolute;left:-30%;right:-30%;top:40%;height:20%;transform:rotate(-26deg);background:linear-gradient(90deg,transparent,#c8962e,#fff2b8,#c8962e,transparent)}
.packart b{font-size:24px;font-weight:800;position:relative}
.packart i{font-style:normal;font-size:15px;position:relative}
.shop{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.tile{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 16px;min-width:130px}
.tile b{font:800 28px "Barlow Condensed",sans-serif}
.tile span{display:block;color:var(--mut);font-size:12px}
@media(prefers-reduced-motion:reduce){.packart,.card[data-r="Epic"] .in::after{animation:none}}
</style></head><body><main>
<header><h1 id="ttl">Iron Vault TCG</h1><nav id="nav"></nav></header>
<div id="app"></div>
<div id="flash"></div>
</main>
<script>
const RAW=`AlmaMater,10,97,93,91
Slayer,10,98,98,96
Etxrnity,10,96,97,93
itachi,10,92,93,94
Kobi,10,97,96,94
Bleed,9,90,90,92
Agitate,8,92,94,93
Sc4r,8,95,91,92
Raezy,7,87,89,89
Mud,10,90,91,93
sheep,9,85,86,86
(GM4) Lichen,9,80,84,85
(GM6) Rhak,10,76,75,87
(GM6) QuickNinja,9,0,0,84
(GM4) TripleStryke,7,76,74,82
feed,6,85,88,82
(GM1) Gentleman,9,80,83,82
(GM2) Onion,6,78,81,81
Kamarov,8,70,74,84
interstellar,5,82,84,89
Playboi,6,84,85,82
Rapid,7,81,85,85
3w0n,7,82,85,85
Lil_May,5,51,48,78
slatt,8,91,90,87
Kaag,8,97,92,94
(GM3) Kerosene,7,77,87,82
Commander,8,73,72,84
ttw,7,86,88,84
Antikure,6,82,80,78
_Akatsuki_,7,90,89,85
Jaw,7,82,85,85
(GM1) Mandilindors,7,80,82,82
_Eddie_,7,80,83,79
Adamoski,2,35,52,43
Fishy,4,42,39,56
ffgr,6,78,82,67
-Trippy-,7,80,82,82
Mashin,7,86,84,79
_-YourDestruction-_,7,82,87,84
Lokirss,7,80,81,86
hohi,7,83,84,83
typeshhhhh,3,74,79,80
Stargazing,8,85,83,84
Raxlyr,8,91,89,88
Invader,9,87,84,83
Iiryzex,9,85,86,92
TheRage,10,85,83,92
Reds,7,74,76,84
ImmortalSteelPistol,8,74,70,74`;
const W=['Legendary','Epic','Rare','Common'],TH=[94,90,85,0];
const P=RAW.split('\n').map((l,id)=>{let [n,r,m,d,o]=l.split(',');const x=n.match(/^\((GM\d)\) (.+)/),g=x?x[1]:'';if(x)n=x[2];n=n.trim();
 r=+r;m=+m;d=+d;o=+o;const est=!m;if(est){m=d=o-10}
 return{id,n,g,r,m,d,o,est,rar:W[TH.findIndex(t=>o>=t)],h:Math.abs([...n].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360}});
const SL={m:'Move',d:'Dodge',o:'Ovr'};
const $=s=>document.querySelector(s),rnd=a=>a[Math.random()*a.length|0];
const DEF={title:'Iron Vault TCG',pack:400,per:4,guar:1,disc:10,start:500,cap:480,pity:10,t0:94,t1:90,t2:85,o0:3,o1:9,o2:28,o3:60,r0:20,r1:8,r2:3,r3:1,s0:400,s1:150,s2:60,s3:20,aura:90,big:94,fx:1,giftId:0,giftAmt:0,giftNote:''};
let CFG={...DEF};
const num=(v,d)=>{v=+v;return isFinite(v)?Math.max(0,Math.min(1e6,Math.round(v))):d};
const A=p=>[0,1,2,3].map(i=>CFG[p+i]);
function setCfg(d){const g=k=>d&&d[k]!=null?d[k]:DEF[k],c={};for(const k in DEF)c[k]=typeof DEF[k]=='number'?num(g(k),DEF[k]):String(g(k)).slice(0,40);c.per=Math.max(1,Math.min(10,c.per));c.disc=Math.min(90,c.disc);CFG=c;TH[0]=c.t0;TH[1]=c.t1;TH[2]=c.t2;P.forEach(x=>{x.rar=rarOf(x.o)});const t=$('#ttl');if(t)t.textContent=c.title;document.title=c.title}
const fresh=()=>({own:{},cor:CFG.start,pity:0,t:Date.now(),gift:CFG.giftId});
let S=null,REF=null,DBH=null,ADMIN=false,EDIT=false,E=null,reel='',ph='load',V='home',rv=null,busy=0,fx=0,tier=0,msg='',tm=0,CD=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const clamp=(v,hi)=>Math.max(0,Math.min(hi,Math.round(+v)||0));
const hue=n=>Math.abs([...n].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
const rarOf=o=>W[TH.findIndex(t=>o>=t)];
const BASE=P.map(c=>({...c,gone:false,off:false}));
const pool=()=>P.filter(c=>!c.gone&&!c.off);
const oddsH=()=>{const o=A('o'),t=o.reduce((a,c)=>a+c)||1;return W.map((w,i)=>`${w} ${Math.round(o[i]/t*1000)/10}%`).join(', ')};
function applyOv(id,d){
 if(!d){const c=P[id];if(!c)return;if(BASE[id]){Object.assign(c,BASE[id]);c.rar=rarOf(c.o)}else c.gone=true;return}
 for(let i=P.length;i<=id;i++)P[i]={id:i,n:'?',g:'',r:0,m:0,d:0,o:0,est:false,rar:'Common',h:0,gone:true,off:false};
 const n=String(d.n||(BASE[id]||{n:'New player'}).n).slice(0,24),o=clamp(d.o,99);
 Object.assign(P[id],{n,r:clamp(d.r,10),m:clamp(d.m,99),d:clamp(d.d,99),o,est:false,gone:false,off:!!d.off,rar:rarOf(o),h:hue(n)})}
function roll(ceil=3){const wt=A('o').map((x,i)=>i>ceil?0:x);let r=Math.random()*wt.reduce((a,c)=>a+c),i=0;while(r>=wt[i]&&i<3){r-=wt[i];i++}const pl=pool().filter(p=>p.rar==W[i]);return rnd(pl.length?pl:pool())}
const add=c=>{S.own[c.id]=(S.own[c.id]||0)+1};
const save=()=>{clearTimeout(tm);tm=setTimeout(()=>REF&&REF.set(S).catch(()=>{msg='Could not save your progress. Check your connection.';render()}),250)};
const rate=()=>{let r=0;const R=A('r');for(const id in S.own){const c=P[id];if(c&&!c.gone)r+=R[W.indexOf(c.rar)]*S.own[id]}return r};
const ready=()=>Math.floor(rate()*Math.min(CFG.cap,(Date.now()-S.t)/6e4));
const dupes=()=>{let g=0;const Q=A('s');for(const id in S.own){const c=P[id];if(c&&!c.gone)g+=(S.own[id]-1)*Q[W.indexOf(c.rar)]}return g};
const bank=()=>{S.cor+=ready();S.t=Date.now()};
const can=c=>S.cor+ready()>=c;
function collect(){const g=ready();if(!g)return;bank();msg=`Collected ${g} corals.`;save();render()}
function sell(){const g=dupes();if(!g||!confirm(`Sell all extra copies for ${g} corals? You keep one of each card.`))return;bank();for(const id in S.own)S.own[id]=1;S.cor+=g;msg=`Sold duplicates for ${g} corals.`;save();render()}
 
const cardH=(c,o={})=>`<div class="card ${o.cls||''}" data-r="${c.rar}" style="--h:${c.h};${o.d?`animation-delay:${o.d}s`:''}"${o.click?` onclick="${o.click}"`:''}><div class="in">
<div class="art">${c.n.replace(/[^a-z0-9]/gi,'').slice(0,2).toUpperCase()}<span class="ovr">${c.o}</span><span class="rar">${c.g?c.g+' · ':''}${c.rar}</span></div>
<div class="nm">${esc(c.n)}</div>
${['m','d','o'].map(k=>`<div class="st"><span>${SL[k]}</span><b>${c[k]}${c.est&&k!='o'?'*':''}</b></div>`).join('')}
<div class="st"><span>Rep</span><b>${c.r}</b></div>${o.tag?`<i class="tag">${o.tag}</i>`:''}${o.cnt>1?`<i class="cnt">x${o.cnt}</i>`:''}</div></div>`;
 
const go=v=>{if(busy)return;V=v;E=null;msg='';render()};
function render(){
 const A=$('#app'),N=$('#nav');
 if(ph!='game'){N.innerHTML='';A.innerHTML=ph=='load'?`<p class="mut">Checking your account...</p>`:`<div class="panel"><h2>Sign in to play</h2><p>Your cards and corals are saved to your account, so you need to be signed in to claude.ai to play. claude.ai lets you sign in or sign up with Google.</p><p>After you sign in, reload this page.</p><p><button class="btn" onclick="location.reload()">Reload</button></p></div>`;return}
 N.innerHTML=`<span class="bal">${S.cor} corals</span>`+[['home','Home'],['shop','Shop'],['col','Collection'],...(ADMIN?[['adm','Admin']]:[])].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 A.innerHTML=V=='home'?homeH():V=='shop'?shopH():V=='adm'?admH():colH();
}
const incomeH=()=>`<div class="panel"><p>Your cards earn <b>${rate()}</b> corals per minute and store up to ${+(CFG.cap/60).toFixed(1)} hours. Ready now: <b>${ready()}</b>.</p><p><button onclick="collect()" ${ready()?'':'disabled'}>Collect corals</button> <button onclick="sell()" ${dupes()?'':'disabled'}>Sell duplicates (+${dupes()})</button></p></div>`;
const packArt=still=>`<div class="packart${still?' still':''}"><b>IRON VAULT</b><i>${CFG.per} CARDS</i></div>`;
const price5=()=>Math.round(CFG.pack*5*(100-CFG.disc)/100);
const tile=(v,l)=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`;
function homeH(){
 const L=P.filter(c=>!c.gone),own=Object.keys(S.own).map(i=>P[i]).filter(c=>c&&!c.gone).sort((a,b)=>b.o-a.o);
 const last=(S.last||[]).map(i=>P[i]).filter(c=>c&&!c.gone).slice(0,8);
 return`<h2>Home</h2>${msg?`<p class="msg">${msg}</p>`:''}<div class="row">${tile(S.cor,'Corals')}${tile(`${own.length} / ${L.length}`,'Cards collected')}${tile(S.opened||0,'Packs opened')}${tile(rate(),'Corals per minute')}</div>
<p><button class="btn" onclick="go('shop')">Open the shop</button> <button onclick="go('col')">View collection</button></p>${incomeH()}
${own.length?`<h3>Your top cards</h3><div class="row">${own.slice(0,4).map(c=>cardH(c,{cnt:S.own[c.id]})).join('')}</div>`:'<p class="mut">You have no cards yet. Visit the shop to buy your first pack.</p>'}
${last.length?`<h3>Latest pack</h3><div class="row">${last.map(c=>cardH(c)).join('')}</div>`:''}`}
function shopH(){
 const cls=`stage${busy&&tier?' rumble'+(tier>1?' big':''):''}${fx&&tier?' shake'+(tier>1?' big':''):''}`;
 const res=rv?`<div class="row" style="justify-content:center">${rv.map((x,i)=>{const h=cardH(x.c,{cls:'pop',d:Math.min(i,12)*.07,tag:x.n?'New':''});return CFG.fx&&x.c.o>=CFG.aura?`<div class="aura" data-r="${x.c.rar}">${h}</div>`:h}).join('')}</div>`:'';
 return`<h2>Shop</h2><div class="panel shop">${packArt(1)}<div><h3>Standard pack</h3><p>${CFG.per} cards per pack.${CFG.guar?' Every pack has at least one Rare or better.':''} Odds per card: ${oddsH()}.${CFG.pity?` A Rare or better is also guaranteed every ${CFG.pity} cards (${S.pity} misses so far).`:''}${CFG.fx?` Pull a ${CFG.aura}+ Ovr card for a special reveal.`:''}</p>
<p><button class="btn" ${!busy&&can(CFG.pack)?'':'disabled'} onclick="buy(1)">Buy pack (${CFG.pack} corals)</button> <button ${!busy&&can(price5())?'':'disabled'} onclick="buy(5)">Buy 5 packs (${price5()} corals)</button></p>
<p class="mut">You have ${S.cor} corals. Earn more from the Home page.</p></div></div>${msg?`<p class="msg">${msg}</p>`:''}<div class="${cls}" id="stage">${busy?reel:res}</div>`}
function buy(k){
 const cost=k==5?price5():CFG.pack;bank();
 if(busy||S.cor<cost)return;busy=1;S.cor-=cost;rv=null;msg='';
 const got=[];
 for(let p=0;p<k;p++){let hit=false;for(let i=0;i<CFG.per;i++){
  const force=(CFG.guar&&i==CFG.per-1&&!hit)||(CFG.pity&&S.pity>=CFG.pity-1);
  const c=force?roll(2):roll();if(c.rar!='Common')hit=true;S.pity=c.rar=='Common'?S.pity+1:0;got.push({c,n:!S.own[c.id]});add(c)}}
 S.opened=(S.opened||0)+k;S.last=got.map(x=>x.c.id);
 const best=got.reduce((a,x)=>x.c.o>a.o?x.c:a,got[0].c);tier=!CFG.fx?0:best.o>=CFG.big?2:best.o>=CFG.aura?1:0;
 const finish=()=>{busy=0;rv=got;fx=1;render();fx=0;if(tier)flash()};
 const set=22,total=26;let t=0;
 const draw=()=>`<div class="row" style="justify-content:center">${got.map(x=>cardH(t>=set?x.c:rnd(pool()),{cls:t>=set&&CFG.fx&&x.c.o>=CFG.aura?'win':''})).join('')}</div>`;
 reel=`<div class="row" style="justify-content:center">${packArt()}</div>`;save();render();
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){setTimeout(finish,600);return}
 setTimeout(()=>{(function tick(){const st=$('#stage');if(st)st.innerHTML=draw();if(++t<total)setTimeout(tick,80+t*3);else setTimeout(finish,500)})()},1100)}
function flash(){const f=$('#flash');f.style.setProperty('--fc',tier>1?'#ffb02e':'#3d7bff');f.className='';void f.offsetWidth;f.className='go'}
const prev=()=>{const n=(E.n||'').trim()||'?',o=clamp(E.o,99);return{g:'',...P[E.id],id:E.id,n,r:clamp(E.r,10),m:clamp(E.m,99),d:clamp(E.d,99),o,est:false,rar:rarOf(o),h:hue(n)}};
const ed=(k,v)=>{E[k]=v;$('#pv').innerHTML=cardH(prev())};
function openEdit(id){if(id<0){id=P.length;E={id,n:'New player',r:5,m:70,d:70,o:70,off:false,isNew:true}}else{const c=P[id];E={id,n:c.n,r:c.r,m:c.m,d:c.d,o:c.o,off:!!c.off}}render();scrollTo({top:0})}
const cardData=()=>({n:(E.n||'').trim().slice(0,24)||'New player',r:clamp(E.r,10),m:clamp(E.m,99),d:clamp(E.d,99),o:clamp(E.o,99),off:!!E.off});
async function saveEdit(){const id=E.id,d=cardData();
 try{await DBH.doc('cards/'+id).set(d);applyOv(id,d);msg=`Saved ${d.n} for every player.`}catch(e){msg='Could not save. Only editors of this page can change cards.'}
 E=null;render()}
async function revert(){const id=E.id;try{await DBH.doc('cards/'+id).delete();applyOv(id,null);msg=BASE[id]?'Reverted to the original stats.':'Card deleted for every player.'}catch(e){msg='Could not do that.'}E=null;render()}
const del=()=>{if(confirm('Delete this card for everyone?'))revert()};
const editH=()=>`<div class="panel"><h2>${E.isNew?'New card':'Edit '+esc((BASE[E.id]||{n:E.n}).n)}</h2><div class="row" style="align-items:flex-start"><div id="pv">${cardH(prev())}</div><div class="form">${[['n','Name','text'],['r','Rep','number'],['m','Move','number'],['d','Dodge','number'],['o','Ovr','number']].map(([k,l,t])=>`<label>${l}<input type="${t}" value="${esc(E[k])}" ${t=='number'?`min="0" max="${k=='r'?10:99}"`:'maxlength="24"'} oninput="ed('${k}',this.value)"></label>`).join('')}<label>In rolls<input type="checkbox" ${E.off?'':'checked'} onchange="ed('off',!this.checked)"></label></div></div><p><button class="btn" onclick="saveEdit()">Save for everyone</button> ${BASE[E.id]?'<button onclick="revert()">Revert to original</button>':E.isNew?'':'<button onclick="del()">Delete card</button>'} <button onclick="E=null;render()">Cancel</button></p><p class="mut">Ovr sets rarity from the thresholds in the Admin tab. Changes reach every player right away.</p></div>`;
function colH(){
 const L=P.filter(c=>!c.gone),have=Object.keys(S.own).filter(i=>P[i]&&!P[i].gone).length;
 const cards=[...L].sort((a,b)=>b.o-a.o).map(c=>cardH(c,EDIT?{cls:'whole'+(c.off?' lock':''),click:`openEdit(${c.id})`}:{cls:S.own[c.id]?(CFG.fx&&c.o>=CFG.aura?'win':''):'lock',cnt:S.own[c.id]})).join('');
 return`<h2>Collection: ${have} of ${L.length}</h2>${ADMIN?`<p><button class="${EDIT?'on':''}" onclick="EDIT=!EDIT;E=null;msg='';render()">${EDIT?'Done editing':'Edit cards'}</button> ${EDIT?'<button onclick="openEdit(-1)">+ New card</button> <span class="mut">Tap a card to change it for every player. Faded cards are out of the rolls.</span>':''}</p>`:''}${msg?`<p class="msg">${msg}</p>`:''}${E?editH():''}<div class="row">${cards}</div>`}
const FIELDS=[['Game',[['title','Game title','text']]],
['Packs and economy',[['pack','Pack price (corals)'],['per','Cards per pack (1 to 10)'],['guar','Rare or better in every pack (1 = yes, 0 = no)'],['disc','5-pack discount (%)'],['start','Starting corals for new accounts'],['cap','Income storage (minutes)'],['pity','Extra guarantee: Rare or better every N cards (0 = off)']]],
['Card odds (relative weights)',[['o0','Legendary'],['o1','Epic'],['o2','Rare'],['o3','Common']]],
['Rarity thresholds (minimum Ovr)',[['t0','Legendary'],['t1','Epic'],['t2','Rare']]],
['Corals earned per minute',[['r0','Legendary'],['r1','Epic'],['r2','Rare'],['r3','Common']]],
['Duplicate sell price',[['s0','Legendary'],['s1','Epic'],['s2','Rare'],['s3','Common']]],
['Pack-opening effects',[['fx','Effects on (1 = yes, 0 = no)'],['aura','Aura and shake from Ovr'],['big','Gold aura and heavy shake from Ovr']]],
['Gift to every player',[['giftAmt','Corals'],['giftNote','Message','text']]]];
const cd=(k,v)=>{CD[k]=v};
const admH=()=>{CD=CD||{...CFG};return`<h2>Admin</h2><p class="mut">Changes apply to every player as soon as you save. Edit individual cards from the Collection tab.</p>${msg?`<p class="msg">${msg}</p>`:''}${FIELDS.map(([t,f])=>`<div class="panel"><h3>${t}</h3><div class="form">${f.map(([k,l,ty])=>`<label>${l}<input type="${ty||'number'}" min="0" value="${esc(CD[k])}" oninput="cd('${k}',this.value)"></label>`).join('')}</div></div>`).join('')}<p><button class="btn" onclick="saveCfg()">Save settings</button> <button onclick="sendGift()">Save and send gift</button> <button onclick="CD={...DEF,giftId:CFG.giftId};render()">Reset to defaults</button></p>`};
async function saveCfg(){setCfg(CD);try{await DBH.doc('config/game').set(CFG);msg='Settings saved for every player.'}catch(e){msg='Could not save settings. Only editors of this page can change them.'}CD=null;render()}
function sendGift(){if(!+CD.giftAmt){msg='Set a gift amount first.';render();return}CD.giftId=CFG.giftId+1;saveCfg()}
function claimGift(){if(!S||S.gift>=CFG.giftId)return;S.gift=CFG.giftId;if(CFG.giftAmt){bank();S.cor+=CFG.giftAmt;msg=`Gift received: ${CFG.giftAmt} corals. ${CFG.giftNote}`}save()}
async function boot(){
 render();
 try{
  const c=window.claude;if(!c)throw 0;
  const [user,db]=await Promise.all([c.use('user'),c.use('db')]);
  const id=user&&await user.id();
  if(!db||!id){ph='gate';render();return}
  REF=db.collection('data/users/'+id).doc('save');
  try{const cs=await db.doc('config/game').get();if(cs.exists)setCfg(cs.data());const cd=await db.collection('cards').get();cd.docs.forEach(x=>applyOv(+x.id,x.data()))}catch(e){}
  const snap=await REF.get();
  S=snap.exists?Object.assign(fresh(),JSON.parse(JSON.stringify(snap.data()))):fresh();
  if(!S.own||typeof S.own!='object')S.own={};
  if(!snap.exists)await REF.set(S);
  DBH=db;ADMIN=!!(await user.canEdit());claimGift();
  db.doc('config/game').onSnapshot(sn=>{setCfg(sn.exists?sn.data():null);claimGift();if(ph=='game'&&!busy&&!E&&!CD)render()},()=>{});
  db.collection('cards').onSnapshot(sn=>{sn.docChanges().forEach(ch=>applyOv(+ch.doc.id,ch.type=='removed'?null:ch.doc.data()||null));if(ph=='game'&&!busy&&!E)render()},()=>{});
  ph='game';
 }catch(e){ph='gate'}
 render();
}
boot();
